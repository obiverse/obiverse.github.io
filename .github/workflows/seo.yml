# SEO on every change (tools/seo.mjs, seo.config.mjs). On push: the heads, lock and crawl files must be
# fresh. After GitHub Pages publishes: tell the engines what changed (IndexNow), then audit the live site.
name: seo
on:
  push:
    branches: [main]
  page_build:
jobs:
  fresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/seo.mjs --check
  live:
    if: github.event_name == 'page_build' && github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: site
        run: node -e "import('./seo.config.mjs').then(({default:s})=>console.log('ORIGIN='+s.origin+'\nKEY='+(s.indexNowKey??'')))" >> "$GITHUB_ENV"
      - run: sleep 90   # the CDN catches up with the build
      - name: indexnow
        if: env.KEY != ''
        run: node tools/seo/cli.mjs indexnow "$ORIGIN" "$KEY" --since "$(date -u -d yesterday +%F)"
      - name: audit
        if: always()
        run: node tools/seo/cli.mjs audit "$ORIGIN" ${{ vars.PSI_KEY && '--psi' || '' }}
        env: { PSI_KEY: '${{ vars.PSI_KEY }}' }
